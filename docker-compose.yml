services:
  postgres:
    image: postgres:17
    container_name: parkingmanager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: parking_manager
    ports:
      - "5432:5432"
    volumes:
      - parkingmanager_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d parking_manager"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  parkingmanager_pgdata:
